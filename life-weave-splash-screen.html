<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Weave - Splash Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #E5E5E5;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Splash Screen 1: Gradient Background */
        .splash-1 {
            background: linear-gradient(135deg, #F5F1EA 0%, #E8D5C4 50%, #D4A574 100%);
        }

        /* Splash Screen 2: White Background */
        .splash-2 {
            background: #FDFBF7;
        }

        /* Splash Screen 3: Terracotta Solid */
        .splash-3 {
            background: linear-gradient(135deg, #D4A574 0%, #C18B5E 100%);
        }

        /* Logo Container */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Basket Weave */
        .basket-weave-large {
            display: grid;
            grid-template-columns: repeat(6, 20px);
            grid-template-rows: repeat(6, 20px);
            gap: 0;
            animation: weaveIn 1s ease-out;
        }

        @keyframes weaveIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .basket-weave-large .cell {
            border-radius: 2px;
        }

        .basket-weave-large .cell.dark {
            background-color: #C18B5E;
        }

        .basket-weave-large .cell.light {
            background-color: #D4A574;
        }

        /* White version for splash 3 */
        .splash-3 .basket-weave-large .cell.dark {
            background-color: #FFFFFF;
        }

        .splash-3 .basket-weave-large .cell.light {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* Wordmark */
        .wordmark {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: 36px;
            font-weight: 500;
            color: #2D2D2D;
            letter-spacing: -0.5px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .splash-3 .brand-name {
            color: white;
        }

        .brand-line {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #D4A574 0%, #C18B5E 100%);
            animation: expandWidth 0.6s ease-out 0.5s both;
        }

        .splash-3 .brand-line {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.6) 0%, #FFFFFF 100%);
        }

        @keyframes expandWidth {
            from {
                width: 0;
            }
            to {
                width: 120px;
            }
        }

        .tagline {
            font-size: 15px;
            color: #666;
            font-weight: 400;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        .splash-3 .tagline {
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Loading Indicator */
        .loading-dots {
            position: absolute;
            bottom: 80px;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #C18B5E;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .splash-3 .dot {
            background: white;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Version Label */
        .version {
            position: absolute;
            bottom: 40px;
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .splash-3 .version {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Label for showcase */
        .screen-label {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        .screen-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
