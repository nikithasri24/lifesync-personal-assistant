name: Test Coverage

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run
        env:
          NODE_ENV: test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Generate coverage summary
        id: coverage
        run: |
          # Extract coverage percentages from JSON summary
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total')
          LINES=$(echo $COVERAGE | jq '.lines.pct')
          STATEMENTS=$(echo $COVERAGE | jq '.statements.pct')
          FUNCTIONS=$(echo $COVERAGE | jq '.functions.pct')
          BRANCHES=$(echo $COVERAGE | jq '.branches.pct')

          echo "lines=$LINES" >> $GITHUB_OUTPUT
          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

          # Create coverage badge color based on coverage percentage
          if (( $(echo "$LINES >= 80" | bc -l) )); then
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          elif (( $(echo "$LINES >= 60" | bc -l) )); then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Create coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: github.ref == 'refs/heads/main'
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: YOUR_GIST_ID_HERE
          filename: lifesync-coverage.json
          label: Coverage
          message: ${{ steps.coverage.outputs.lines }}%
          color: ${{ steps.coverage.outputs.color }}

      - name: Comment PR with coverage
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = {
              lines: '${{ steps.coverage.outputs.lines }}',
              statements: '${{ steps.coverage.outputs.statements }}',
              functions: '${{ steps.coverage.outputs.functions }}',
              branches: '${{ steps.coverage.outputs.branches }}'
            };

            const comment = `## 📊 Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Lines | ${coverage.lines}% |
            | Statements | ${coverage.statements}% |
            | Functions | ${coverage.functions}% |
            | Branches | ${coverage.branches}% |

            ${coverage.lines >= 80 ? '✅ Great coverage!' :
              coverage.lines >= 60 ? '⚠️ Coverage is acceptable but could be improved.' :
              '🚨 Coverage is below threshold. Please add more tests.'}

            [View full coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
